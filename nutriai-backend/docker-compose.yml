services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nutriai
      POSTGRES_PASSWORD: nutriai
      POSTGRES_DB: nutriai
    ports:
      - "5432:5432"
    volumes:
      - nutriai_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nutriai:nutriai@db:5432/nutriai
    depends_on:
      - db

volumes:
  nutriai_pg:
